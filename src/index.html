<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>SuperSoft POS — Retail operations</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#f5f6fb" />
    <meta
      name="description"
      content="SuperSoft POS — point of sale, inventory, receivables and reporting for multi-branch retail."
    />
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <script>
      // Paint the stored theme before first render so there is no flash.
      try {
        const stored = localStorage.getItem('supersoft-pos.theme') || 'system';
        const dark =
          stored === 'dark' ||
          (stored === 'system' && matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.classList.toggle('dark', dark);
      } catch (_) {}
    </script>
  </head>
  <body>
    <app-root></app-root>
  </body>
</html>
